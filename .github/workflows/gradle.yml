# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      environment:
        description: "环境"
        required: true
        default: "prod"
        options:
          - prod

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: 设置gradlew权限
        run: chmod +x gradlew

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar # 为这个Artifact命名，下载时需要用到
          path: build/libs/*.jar # Gradle默认将JAR包输出到这个目录
          retention-days: 7 # 可选：Artifact在GitHub上的保留天数（默认90天）

  test-deploy:
    # 3. 依赖构建任务：仅在 build 任务成功后才运行
    needs: build
    runs-on: ubuntu-latest
    # 4. 环境标识：在GitHub界面中归类显示
    environment: test
    permissions:
      contents: write
    steps:
      # +++ 新增：下载 build 任务上传的 Artifact +++
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar # 必须与上传时的名称一致
          path: ./deploy-artifact/ # 下载到本步骤的哪个目录（可自定义）
      # 后续部署步骤：现在 JAR 包已位于 ./deploy-artifact/ 目录下
      - name: Deploy to Test Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: root # 或你的服务器用户名
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          script: |
            # 将JAR包从运行器上传到测试服务器
            scp -o StrictHostKeyChecking=no ./deploy-artifact/*.jar root@${{ secrets.TEST_SERVER_HOST }}:${{ secrets.TEST_DEPLOY_PATH }}/
            # 在服务器上重启应用
            ssh -o StrictHostKeyChecking=no root@${{ secrets.TEST_SERVER_HOST }} "sudo systemctl restart my-test-app.service"

  prod-deploy:
    # 6. 手动控制：设置为始终等待手动触发，不依赖push事件
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production # 关联生产环境，便于权限管理和审计
    permissions:
      contents: write
    steps:
      - name: 部署生产
        run: echo "部署生产环境"